name: CI

on:
  push:
    branches-ignore: [main] # main runs these tests inside the deploy workflow
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lawhub
          POSTGRES_PASSWORD: lawhub
          POSTGRES_DB: lawhub
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Same database engine as production (Neon runs Postgres 17).
      DATABASE_URL: postgresql://lawhub:lawhub@localhost:5432/lawhub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[postgres]"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
