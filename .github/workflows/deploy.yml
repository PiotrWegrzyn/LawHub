name: Deploy

# Every push to main: test, build the image, deploy it to Cloud Run.
# Repository variables come from `terraform output github_variables`.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # Skipped until the GCP variables from infra/README.md step 4 are set.
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to exchange GitHub's OIDC token for Google credentials
    env:
      IMAGE: ${{ vars.GCP_IMAGE_REPO }}/lawhub:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Migrations run here, once per deploy, against Neon's direct endpoint,
      # before the new revision takes traffic. Keep migrations backward
      # compatible: the old revision serves until the new one is ready.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Migrate database
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: migrate-only
        run: |
          pip install -e ".[postgres]"
          python manage.py migrate --noinput

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE" \
            --quiet

      - name: Smoke test
        run: |
          url=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$url/health"
