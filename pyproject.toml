[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawhub"
version = "0.1.0"
description = "Laws as code: versioned in git, tagged per provision, subscribable."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pdfplumber>=0.11",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lawhub = "lawhub.cli:main"

[tool.setuptools.packages.find]
include = ["lawhub*"]

[tool.setuptools.package-data]
"lawhub" = ["sources/pl/*.toml", "tagging/rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
